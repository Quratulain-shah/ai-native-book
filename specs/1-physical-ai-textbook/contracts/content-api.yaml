### PUT /content-units/{unit_id}/progress
Update progress for a specific content unit.

#### Request
```json
{
  "completion_status": "completed",
  "time_spent_minutes": 45,
  "notes": "Understood concepts well, completed exercises successfully"
}
```

#### Response
**200 OK**
```json
{
  "id": "unit_1_2",
  "completion_status": "completed",
  "time_spent_minutes": 45,
  "notes": "Understood concepts well, completed exercises successfully",
  "updated_at": "2025-12-16T14:30:00Z"
}
```

### GET /search
Search textbook content using RAG (Retrieval-Augmented Generation).

#### Query Parameters
- `q`: Search query string
- `module` (optional): Filter by module ID
- `limit` (optional): Number of results to return (default: 10, max: 20)

#### Response
**200 OK**
```json
{
  "query": "navigation in ROS 2",
  "results": [
    {
      "id": "chunk_123",
      "content_unit_id": "unit_3_4",
      "title": "Nav2 Systems",
      "module": "Module 3: The AI-Robot Brain",
      "content": "Navigation in ROS 2 is handled by the Navigation2 (Nav2) stack...",
      "relevance_score": 0.92,
      "source_path": "/module-3/nav2-systems"
    },
    {
      "id": "chunk_456",
      "content_unit_id": "unit_2_5",
      "title": "Digital Twin Exercises",
      "module": "Module 2: The Digital Twin",
      "content": "Navigation algorithms can be tested in simulation before deployment...",
      "relevance_score": 0.78,
      "source_path": "/module-2/digital-twin-exercises"
    }
  ],
  "total_results": 2
}
```

### GET /exercises/{exercise_id}
Get details for a specific exercise.

#### Response
**200 OK**
```json
{
  "id": "ex_1_1_1",
  "title": "Create a Simple Publisher Node",
  "description": "Create a ROS 2 node that publishes messages to a topic",
  "difficulty_level": "beginner",
  "estimated_completion_time": 30,
  "solution_reference": "/solutions/ex_1_1_1",
  "related_concepts": ["topics", "publishers", "nodes"],
  "module_id": "module_1",
  "content_unit_id": "unit_1_1"
}
```

### POST /exercises/{exercise_id}/submit
Submit an exercise attempt.

#### Request
```json
{
  "attempt_code": "import rclpy\nfrom rclpy.node import Node\n\nclass PublisherNode(Node):\n    def __init__(self):\n        super().__init__('publisher_node')\n        # Implementation here",
  "notes": "Implemented publisher node successfully"
}
```

#### Response
**200 OK**
```json
{
  "exercise_id": "ex_1_1_1",
  "user_id": "user_1234567890",
  "score": 0.8,
  "attempt_count": 1,
  "feedback": "Good implementation! Consider adding error handling for robustness.",
  "completed_at": "2025-12-16T14:45:00Z"
}
```

## Error Response Format
All error responses follow this format:
```json
{
  "error": {
    "code": "ERROR_CODE",
    "message": "Human-readable error message",
    "details": "Additional error details if applicable"
  }
}
```

## Common Error Codes
- `INVALID_INPUT`: Request data doesn't match expected format
- `UNAUTHORIZED`: Missing or invalid authentication token
- `NOT_FOUND`: Requested resource doesn't exist
- `FORBIDDEN`: User doesn't have permission to access resource
- `INTERNAL_ERROR`: Server-side error occurred