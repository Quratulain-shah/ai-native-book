# API Contract: Content Service

## Overview
Content service for the Physical AI & Humanoid Robotics textbook, providing access to textbook content, progress tracking, and related data.

## Base URL
`/api/content`

## Authentication
All endpoints require a valid JWT token in the Authorization header:
```
Authorization: Bearer {jwt_token}
```

## Endpoints

