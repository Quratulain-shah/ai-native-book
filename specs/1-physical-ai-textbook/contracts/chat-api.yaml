## Error Response Format
All error responses follow this format:
```json
{
  "error": {
    "code": "ERROR_CODE",
    "message": "Human-readable error message",
    "details": "Additional error details if applicable"
  }
}
```

## Common Error Codes
- `INVALID_INPUT`: Request data doesn't match expected format
- `UNAUTHORIZED`: Missing or invalid authentication token
- `NOT_FOUND`: Requested session or resource doesn't exist
- `CONTEXT_TOO_LONG`: Message exceeds maximum context length
- `RAG_SEARCH_FAILED`: Failed to retrieve relevant content from knowledge base
- `AI_SERVICE_UNAVAILABLE`: External AI service is temporarily unavailable
- `INTERNAL_ERROR`: Server-side error occurred