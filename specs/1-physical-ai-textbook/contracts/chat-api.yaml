# API Contract: Chat Service (RAG Integration)

## Overview
Chat service providing AI-powered assistance for the Physical AI & Humanoid Robotics textbook using Retrieval-Augmented Generation (RAG). The service integrates with OpenAI APIs, Neon Postgres, and Qdrant Cloud to provide contextual answers based on textbook content.

## Base URL
`/api/chat`

## Authentication
All endpoints require a valid JWT token in the Authorization header:
```
Authorization: Bearer {jwt_token}
```

## Endpoints

### POST /chat
Send a message to the AI assistant and receive a contextual response based on textbook content.

#### Request
```json
{
  "message": "Explain how ROS 2 differs from ROS 1 in terms of architecture?",
  "context": {
    "module_id": "module_1",
    "content_unit_id": "unit_1_1",
    "session_id": "session_1234567890"
  },
  "options": {
    "include_citations": true,
    "max_tokens": 500,
    "temperature": 0.7
  }
}
```

#### Response
**200 OK**
```json
{
  "response_id": "resp_9876543210",
  "message": "ROS 2 differs significantly from ROS 1 in its architecture. Key differences include:\n\n1. **Middleware**: ROS 2 uses DDS (Data Distribution Service) as its underlying middleware, providing better support for distributed systems and real-time communication.\n2. **Communication**: ROS 2 implements a client-server model for services and uses topics for pub/sub communication with better QoS (Quality of Service) controls.\n3. **Tools**: ROS 2 has improved tooling with better support for multi-robot systems.\n\nFor more details, see Module 1, Chapter 1: ROS 2 Fundamentals.",
  "citations": [
    {
      "content_unit_id": "unit_1_1",
      "title": "ROS 2 Fundamentals",
      "path": "/module-1/ros2-fundamentals",
      "relevance_score": 0.95
    }
  ],
  "context_used": {
    "module_id": "module_1",
    "content_unit_id": "unit_1_1",
    "chunks_referenced": 3
  },
  "timestamp": "2025-12-16T15:30:00Z"
}
```

### POST /chat/session
Start a new chat session or continue an existing one.

#### Request
```json
{
  "session_context": {
    "module_id": "module_1",
    "content_unit_id": "unit_1_1",
    "user_intent": "learning about ROS 2 architecture"
  },
  "user_id": "user_1234567890"
}
```

#### Response
**200 OK**
```json
{
  "session_id": "session_new_12345",
  "created_at": "2025-12-16T15:30:00Z",
  "context": {
    "module_id": "module_1",
    "content_unit_id": "unit_1_1",
    "user_intent": "learning about ROS 2 architecture"
  },
  "message_history_count": 0
}
```

### GET /chat/session/{session_id}
Get details about a specific chat session.

#### Response
**200 OK**
```json
{
  "session_id": "session_1234567890",
  "user_id": "user_1234567890",
  "created_at": "2025-12-16T15:00:00Z",
  "last_activity": "2025-12-16T15:30:00Z",
  "context": {
    "module_id": "module_1",
    "content_unit_id": "unit_1_1"
  },
  "message_count": 5,
  "is_active": true
}
```

### GET /chat/session/{session_id}/history
Get the message history for a specific chat session.

#### Response
**200 OK**
```json
{
  "session_id": "session_1234567890",
  "messages": [
    {
      "id": "msg_1",
      "sender_type": "user",
      "content": "What is ROS 2?",
      "timestamp": "2025-12-16T15:05:00Z"
    },
    {
      "id": "msg_2",
      "sender_type": "ai_assistant",
      "content": "ROS 2 (Robot Operating System 2) is the next generation of the Robot Operating System...",
      "timestamp": "2025-12-16T15:05:02Z",
      "citations": [
        {
          "content_unit_id": "unit_1_1",
          "title": "ROS 2 Fundamentals",
          "path": "/module-1/ros2-fundamentals"
        }
      ]
    },
    {
      "id": "msg_3",
      "sender_type": "user",
      "content": "How does it differ from ROS 1?",
      "timestamp": "2025-12-16T15:30:00Z"
    }
  ]
}
```

### POST /chat/context-switch
Switch the context of the current chat session to a different module or content unit.

#### Request
```json
{
  "session_id": "session_1234567890",
  "new_context": {
    "module_id": "module_3",
    "content_unit_id": "unit_3_2",
    "topic_focus": "Isaac ROS integration"
  }
}
```

#### Response
**200 OK**
```json
{
  "session_id": "session_1234567890",
  "previous_context": {
    "module_id": "module_1",
    "content_unit_id": "unit_1_1"
  },
  "current_context": {
    "module_id": "module_3",
    "content_unit_id": "unit_3_2",
    "topic_focus": "Isaac ROS integration"
  },
  "context_switched_at": "2025-12-16T15:35:00Z"
}
```

### POST /chat/feedback
Provide feedback on the quality of an AI response.

#### Request
```json
{
  "response_id": "resp_9876543210",
  "rating": 4,
  "useful": true,
  "accuracy_rating": "accurate",
  "suggestions": "Could include more specific examples from the textbook",
  "user_id": "user_1234567890"
}
```

#### Response
**200 OK**
```json
{
  "response_id": "resp_9876543210",
  "feedback_recorded": true,
  "feedback_id": "feedback_555666777",
  "timestamp": "2025-12-16T15:40:00Z"
}
```

